name: cfwtxt
description: CF-Workers-TXT 客户端 —— Android + Windows，不依赖浏览器
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # 业务逻辑全在 core 里（纯 Dart、零依赖、可在 CI 里 dart test）
  cfwtxt_core:
    path: ../core

  # 站点档案（站点地址必须运行时可改）
  shared_preferences: ^2.2.3

  # 本地同步目录、下载落点、草稿
  path_provider: ^2.1.3

  # 密码与会话 Cookie 走平台安全存储（Android Keystore / Windows DPAPI），
  # 绝不写进 shared_preferences
  #
  # 注意：这两个包必须一起升。file_picker 12+ 的 Windows 实现要求 win32 ^6，
  # 而 flutter_secure_storage 9.x 钉的是 win32 ^5，单独升 file_picker 解不出来。
  # 也不能停在 file_picker 8.x：它自己的 Android 模块写死 compileSdk 34，
  # 而它的传递依赖 flutter_plugin_android_lifecycle 要求 ≥36，CI 上会以
  # ":file_picker:checkReleaseAarMetadata" 失败（新版改成继承 flutter.compileSdkVersion）。
  flutter_secure_storage: ^11.2.0

  # 选文件上传（Android 与 Windows 都支持）
  file_picker: ^13.1.0

  # 分享链接用系统浏览器打开（HTML 预览也走它，见 ARCHITECTURE.md §1）
  url_launcher: ^6.3.0

  # Markdown 预览（原生渲染，不用 WebView）
  flutter_markdown: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
