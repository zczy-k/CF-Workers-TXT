<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>visual-audit</title>
<style>body{margin:0;font:13px/1.5 system-ui} #fr{width:1080px;height:660px;border:0;display:block}</style>
</head>
<body>
<div id="bar" style="padding:6px 10px;background:#111;color:#eee">加载中…</div>
<iframe id="fr"></iframe>
<script src="mock.js"></script>
<script src="worker_testable.js"></script>
<script>
(async function(){
  var w = window.__worker, M = window.__mock;
  var ORIGIN = 'https://demo.workers.dev';
  var ADMIN = '/adm-123';
  var PW = 'pw123456';
  var enc = function(s){ return new TextEncoder().encode(s); };
  function sha256Hex(t){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return x.toString(16).padStart(2,'0'); }).join('');
    });
  }
  var cookie = 'wbauth=' + await sha256Hex(PW + '::adm-123');

  var R2 = new M.MockR2(), KV = new M.MockKV(), exec = M.makeExec();
  var env = { R2: R2, KV: KV, ADMIN_UUID: 'adm-123', FILENAME: '视觉验证盘', PASSWORD: PW };
  window.__mockEnv = env; window.__mockExec = exec;

  function call(path, init){
    var base = new Request(ORIGIN + path, init || {});
    var shim = { get: function(n){ return String(n).toLowerCase() === 'cookie' ? cookie : base.headers.get(n); },
                 has: function(n){ return this.get(n) !== null; } };
    var req = new Proxy(base, { get: function(t, p){
      if (p === 'headers') return shim;
      if (p === 'clone') return function(){ return req; };
      var v = t[p]; return typeof v === 'function' ? v.bind(t) : v;
    } });
    return w.fetch(req, env, exec);
  }
  var jpost = function(path, obj){ return call(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj) }); };

  // 造点数据
  await jpost(ADMIN + '/api', { action:'mkdir', path:'', name:'日常笔记' });
  await jpost(ADMIN + '/api', { action:'mkdir', path:'', name:'重要资料', protected:true });
  await jpost(ADMIN + '/api', { action:'mkdir', path:'', name:'照片' });
  await call(ADMIN + '/api?path=' + encodeURIComponent('日常笔记/随手记.txt'), { method:'PUT', headers:{'Content-Type':'text/plain'}, body: enc('随手写的') });
  await call(ADMIN + '/api?path=' + encodeURIComponent('重要资料/合同.txt'), { method:'PUT', headers:{'Content-Type':'text/plain'}, body: enc('绝密合同') });
  await call(ADMIN + '/api?path=' + encodeURIComponent('照片/a.txt'), { method:'PUT', headers:{'Content-Type':'text/plain'}, body: enc('x') });

  var html = await (await call(ADMIN)).text();
  document.getElementById('bar').textContent = 'admin html chars=' + html.length;
  window.__ck = cookie;

  // 页面自带 CSP（meta）会挡住内联脚本，所以注入脚本要带上页面自己的 nonce
  var nonce = (html.match(/<script nonce="([^"]+)"/) || [])[1] || '';
  // srcdoc 里 CSP meta 会阻止内联脚本执行 —— 视觉验证不需要它，直接去掉
  html = html.replace(/<meta[^>]*http-equiv="Content-Security-Policy"[^>]*>/i, '');
  // 注入"把页面内的 fetch 转发给内存 worker"，必须在应用脚本之前执行
  var override = '<script nonce="' + nonce + '">' +
    'window.fetch=function(i,init){' +
      'var url=(typeof i==="string")?i:((i&&i.url)||String(i));' +
      'var u=new URL(url,"https://demo.workers.dev/");' +
      'var base=new Request(u.toString(),init||{});' +
      'var cookie=parent.__ck;' +
      'var shim={get:function(n){return String(n).toLowerCase()==="cookie"?cookie:base.headers.get(n);},has:function(n){return this.get(n)!==null;}};' +
      'var req=new Proxy(base,{get:function(t,p){if(p==="headers")return shim;if(p==="clone")return function(){return req;};var v=t[p];return typeof v==="function"?v.bind(t):v;}});' +
      'return parent.__worker.fetch(req,parent.__mockEnv,parent.__mockExec);' +
    '};' +
  '<\/script>';
  html = html.replace('<script nonce="', override + '<script nonce="');

  var fr = document.getElementById('fr');
  window.__ready = false;
  fr.addEventListener('load', function(){
    setTimeout(function(){ window.__ready = true; document.getElementById('bar').textContent = 'ready'; }, 500);
  });
  fr.srcdoc = html;
})();
</script>
</body></html>
