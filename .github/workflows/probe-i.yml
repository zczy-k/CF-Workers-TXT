name: probe-i

# docker 形式的 action（走 ghcr/dockerhub，不走 action 仓库下载）。
on:
  push:
    paths:
      - '.github/workflows/probe-i.yml'

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    steps:
      - uses: docker://alpine:3.20
        with:
          entrypoint: /bin/echo
          args: docker action ok
