name: probe-c
'on':
  push:
    paths:
    - .github/workflows/probe-c.yml
jobs:
  windows:
    name: Windows 便携版
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
    - uses: actions/checkout@v4
    - uses: subosito/flutter-action@v2
      with:
        channel: ${{ env.FLUTTER_CHANNEL }}
        cache: true
    - uses: actions/download-artifact@v4
      with:
        name: shell-branding
        path: ${{ runner.temp }}/branding
    - name: 读取本次白标参数
      shell: pwsh
      run: "Get-Content \"$env:RUNNER_TEMP\\branding\\app-id.env\" | ForEach-Object {\n  if ($_ -match '^([A-Z_]+)=(.*)$') {\n    Add-Content -Path $env:GITHUB_ENV -Value \"$($matches[1])=$($matches[2])\" -Encoding utf8\n  }\n}\n"
    - name: 打开桌面支持
      run: flutter config --enable-windows-desktop
    - name: 确保 nuget 可用
      shell: pwsh
      run: "if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {\n  choco install nuget.commandline -y --no-progress\n  Add-Content -Path $env:GITHUB_PATH -Value \"C:\\ProgramData\\chocolatey\\bin\"\n}\n(Get-Command nuget).Source\n"
    - name: 生成 Windows 平台脚手架
      shell: pwsh
      run: 'flutter create --platforms=windows --org "$env:ORG" --project-name "$env:NAME" "$env:RUNNER_TEMP\scaffold"

        Copy-Item -Recurse "$env:RUNNER_TEMP\scaffold\windows" ".\windows"

        '
    - name: 换成白标图标、窗口标题与预置配置（并打 Windows 编译补丁）
      shell: pwsh
      run: "# Continue + 显式 -ErrorAction Stop：既不让原生命令的 stderr 变成终止错误\n# （pwsh 7.4+ 的坑），又让 Copy-Item 真失败时确实失败。\n# 整段包在 try/finally 里：无论成功失败，日志都会落到文件，失败注解才拿得到文本。\n$ErrorActionPreference = 'Continue'\n$log = \"$env:RUNNER_TEMP\\patch-windows.log\"\n$lines = New-Object System.Collections.Generic.List[string]\n$fail = 0\ntry {\n  $script = \"$env:GITHUB_WORKSPACE\\shell\\tools\\patch_platform.py\"\n  $lines.Add(\"APP_NAME_EFFECTIVE=$env:APP_NAME_EFFECTIVE  APP_ID_EFFECTIVE=$env:APP_ID_EFFECTIVE\")\n\n  Copy-Item \"$env:RUNNER_TEMP\\branding\\app_icon.ico\" \"windows\\runner\\resources\\app_icon.ico\" -Force -ErrorAction Stop\n  # 托盘图标是**另一份**资产（assets/tray_icon.ico，pubspec 里单独声明，\n  # 由 tray_manager 从包内读出来解到数据目录）。以前只换 exe 图标不换它，\n  # 结果就是\"窗口/exe/界面左上角都是新图标，唯独托盘还是仓库里那张旧图\"。\n  Copy-Item \"$env:RUNNER_TEMP\\branding\\app_icon.ico\" \"assets\\tray_icon.ico\" -Force -ErrorAction Stop\n  Copy-Item \"$env:RUNNER_TEMP\\branding\\preset.json\" \"assets\\preset.json\" -Force -ErrorAction Stop\n\n  # runner 上 python / py / python3 到底哪个能用不一定，而且必须**真跑一次**才算数：\n  # Windows 上 python.exe 可能只是商店\"应用执行别名\"占位符，存在但一跑就报\n  # \"Python was not found\" 然后退出 1（本机就是这样，CI 上也可能）。\n  $cands = @(\n    @{ exe = 'python';  pre = @() },\n    @{ exe = 'py';      pre = @('-3') },\n    @{ exe = 'python3'; pre = @() }\n  )\n  $chosen = $null\n  foreach ($c in $cands) {\n    if (-not (Get-Command $c.exe -ErrorAction SilentlyContinue)) { continue }\n    $pre = $c.pre\n    $probe = @($pre) + @('-c', 'import sys;print(sys.version)')\n    & $c.exe @probe *> $null\n    if ($LASTEXITCODE -eq 0) { $chosen = $c; break }\n    $lines.Add(\"$($c.exe) 不可用（退出码 $LASTEXITCODE），换下一个\")\n  }\n  if ($null -eq $chosen) {\n    $lines.Add(\"错误：runner 上找不到可用的 python（试过 python / py -3 / python3）\")\n    $fail = 1\n  } else {\n    $pre = $chosen.pre\n    $lines.Add(\"用的 python：$($chosen.exe) $($pre -join ' ')\")\n    $argv = @($pre) + @($script, 'windows', 'windows', \"$env:APP_NAME_EFFECTIVE\")\n    $lines.Add((& $chosen.exe @argv 2>&1 | Out-String))\n    $code = $LASTEXITCODE\n    if ($null -eq $code) { $code = 0 }\n    $lines.Add(\"patch_platform.py windows 退出码：$code\")\n    if ($code -ne 0) { $fail = $code }\n\n    # MSVC 14.51 起 /await 与 <experimental/coroutine> 是硬错误，而上游\n    # flutter_inappwebview_windows 还在用；给 CMakeLists.txt 注入静音宏。\n    $cmake = \"$env:GITHUB_WORKSPACE\\shell\\app\\windows\\CMakeLists.txt\"\n    $argv2 = @($pre) + @($script, 'cmake', $cmake)\n    $lines.Add((& $chosen.exe @argv2 2>&1 | Out-String))\n    $code2 = $LASTEXITCODE\n    if ($null -eq $code2) { $code2 = 0 }\n    $lines.Add(\"patch_platform.py cmake 退出码：$code2\")\n    if ($code2 -ne 0) { $fail = $code2 }\n  }\n} catch {\n  $fail = 1\n  $lines.Add(\"异常：\" + $_.Exception.Message)\n} finally {\n  $lines | Tee-Object -FilePath $log\n}\nif ($fail -ne 0) { exit $fail }\n"
    - name: pub get
      shell: pwsh
      run: '$ErrorActionPreference = ''Continue''

        flutter pub get 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-pub.log"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: 静态分析（只把 error 当失败）
      shell: pwsh
      run: '$ErrorActionPreference = ''Continue''

        flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-analyze.log"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: 构建 release
      shell: pwsh
      run: '$ErrorActionPreference = ''Continue''

        flutter build windows --release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-build.log"

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: 打包便携版
      shell: pwsh
      run: '$src = "build\windows\x64\runner\Release"

        if (-not (Test-Path $src)) { throw "没找到产物目录：$src" }

        $out = "$env:RUNNER_TEMP\webshell-windows-$env:APP_ID_EFFECTIVE.zip"

        Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal

        Write-Host "产物：" (Get-Item $out).Length "bytes"

        '
    - uses: actions/upload-artifact@v4
      with:
        name: webshell-windows-x64
        path: ${{ runner.temp }}/webshell-windows-*.zip
        if-no-files-found: error
        retention-days: 30
    - name: 失败原因（免登录可读）
      if: failure()
      shell: pwsh
      run: "$cands = @()\n$cands += Get-ChildItem \"$env:RUNNER_TEMP\\*.log\" -ErrorAction SilentlyContinue\n$cands += Get-ChildItem \"$(Split-Path $env:RUNNER_TEMP -Parent)\\_diag\\*.log\" -ErrorAction SilentlyContinue\n$files = $cands | Sort-Object LastWriteTime -Descending | Select-Object -First 3\nif (-not $files) {\n  # 连日志都没找到时，把诊断目录里到底有什么打出来，别只说\"请登录查看\"\n  $where = \"$(Split-Path $env:RUNNER_TEMP -Parent)\\_diag\"\n  $hint = (Get-ChildItem $where -ErrorAction SilentlyContinue | Select-Object -First 12 -ExpandProperty Name) -join \", \"\n  Write-Host \"::error title=Windows 构建失败::没找到日志文件（$where 下有：$hint）\"\n  return\n}\nforeach ($f in $files) {\n  $text = (Get-Content -LiteralPath $f.FullName -Tail 30 -ErrorAction SilentlyContinue) -join \" ~ \"\n  if ($text.Length -gt 2500) { $text = $text.Substring($text.Length - 2500) }\n  Write-Host \"::error title=$($f.Name) 尾部::$text\"\n}\n"
