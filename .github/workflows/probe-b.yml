name: probe-b
'on':
  push:
    paths:
    - .github/workflows/probe-b.yml
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@v2
      with:
        channel: ${{ env.FLUTTER_CHANNEL }}
        cache: true
    - uses: actions/download-artifact@v4
      with:
        name: shell-branding
        path: ${{ runner.temp }}/branding
    - name: 读取本次白标参数
      run: 'cat "$RUNNER_TEMP/branding/app-id.env" >> "$GITHUB_ENV"

        echo "本次构建：$APP_ID_EFFECTIVE（$APP_NAME_EFFECTIVE）"

        '
    - name: 生成 Android 平台脚手架
      run: "flutter create \\\n  --platforms=android \\\n  --org \"$ORG\" \\\n  --project-name \"$NAME\" \\\n  \"$RUNNER_TEMP/scaffold\"\ncp -r \"$RUNNER_TEMP/scaffold/android\" ./android\n"
    - name: 放入白标图标与预置配置
      run: "set -o pipefail\n{\n  cp -r \"$RUNNER_TEMP/branding/android-res/.\" android/app/src/main/res/\n  cp \"$RUNNER_TEMP/branding/preset.json\" assets/preset.json\n  # 托盘图标（桌面端用；Android 不打托盘，但保持两端资产口径一致）\n  cp \"$RUNNER_TEMP/branding/app_icon.ico\" assets/tray_icon.ico\n  python3 \"$GITHUB_WORKSPACE/shell/tools/patch_platform.py\" \\\n    manifest android/app/src/main/AndroidManifest.xml \"$APP_NAME_EFFECTIVE\"\n  # 下载通知/前台服务：Kotlin + manifest 权限，全平台 API 零新依赖\n  python3 \"$GITHUB_WORKSPACE/shell/tools/patch_platform.py\" \\\n    notify android/app/src/main/AndroidManifest.xml \\\n    android/app/src/main/kotlin\n} 2>&1 | tee \"$RUNNER_TEMP/patch-android.log\"\n"
    - name: pub get
      run: 'set -o pipefail

        flutter pub get 2>&1 | tee "$RUNNER_TEMP/android-pub.log"

        '
    - name: 补丁：上游插件的 proguard 文件名
      run: "set -o pipefail\n{\n  PUB=\"${PUB_CACHE:-$HOME/.pub-cache}\"\n  found=0\n  for f in \"$PUB\"/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do\n    [ -f \"$f\" ] || continue\n    if grep -q 'proguard-android\\.txt' \"$f\"; then\n      sed -i 's/proguard-android\\.txt/proguard-android-optimize.txt/g' \"$f\"\n      echo \"已补丁：$f\"\n      found=1\n    fi\n  done\n  if [ \"$found\" = 0 ]; then\n    echo \"提示：没有需要补丁的 flutter_inappwebview_android（上游可能已修）\"\n  fi\n} 2>&1 | tee \"$RUNNER_TEMP/patch-proguard.log\"\n"
    - name: 静态分析（只把 error 当失败）
      run: 'set -o pipefail

        flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/android-analyze.log"

        '
    - name: App 组件测试（界面流程）
      run: 'set -o pipefail

        flutter test 2>&1 | tee "$RUNNER_TEMP/android-widget-test.log"

        '
    - name: 解出签名材料
      run: "set -o pipefail\nmkdir -p \"$RUNNER_TEMP/ks\"\nif [ -n \"${{ secrets.ANDROID_KEYSTORE_BASE64 }}\" ]; then\n  echo \"keystore 来源：GitHub Secrets\"\n  printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > \"$RUNNER_TEMP/ks/release.jks\"\n  echo \"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\" > \"$RUNNER_TEMP/ks/store-pass.txt\"\n  echo \"${{ secrets.ANDROID_KEY_ALIAS }}\" > \"$RUNNER_TEMP/ks/alias.txt\"\n  echo \"${{ secrets.ANDROID_KEY_PASSWORD }}\" > \"$RUNNER_TEMP/ks/key-pass.txt\"\nelif [ -f ../branding/release.jks ]; then\n  echo \"keystore 来源：仓库 shell/branding/release.jks\"\n  cp ../branding/release.jks \"$RUNNER_TEMP/ks/release.jks\"\n  printf 'webshell-release' > \"$RUNNER_TEMP/ks/store-pass.txt\"\n  : > \"$RUNNER_TEMP/ks/alias.txt\"\n  printf 'webshell-release' > \"$RUNNER_TEMP/ks/key-pass.txt\"\nelse\n  echo \"keystore 来源：Flutter 模板 debug keystore（兜底）\"\n  cp \"$HOME/.android/debug.keystore\" \"$RUNNER_TEMP/ks/release.jks\"\n  printf 'android' > \"$RUNNER_TEMP/ks/store-pass.txt\"\n  printf 'androiddebugkey' > \"$RUNNER_TEMP/ks/alias.txt\"\n  printf 'android' > \"$RUNNER_TEMP/ks/key-pass.txt\"\nfi\nls -l \"$RUNNER_TEMP/ks\"\n"
    - name: 工具链快照
      run: "set -o pipefail\n{\n  echo \"=== flutter ===\"\n  flutter --version\n  echo \"=== java ===\"\n  java -version 2>&1\n  echo \"=== gradle-wrapper ===\"\n  grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties || true\n  echo \"=== settings.gradle 插件版本 ===\"\n  grep -nE 'com\\.android\\.application|org\\.jetbrains\\.kotlin\\.android|id\\(' android/settings.gradle* 2>/dev/null | head -20 || true\n  echo \"=== app/build.gradle 关键行 ===\"\n  grep -nE 'compileSdk|targetSdk|minSdk|proguard|minifyEnabled|shrinkResources|ndkVersion' android/app/build.gradle* 2>/dev/null | head -20 || true\n} 2>&1 | tee \"$RUNNER_TEMP/android-toolchain.log\"\n"
    - name: 给 Flutter 自带 included build 补插件仓库
      run: "set -o pipefail\nFR=\"${FLUTTER_ROOT:-}\"\nif [ -z \"$FR\" ]; then\n  FR=\"$(cd \"$(dirname \"$(command -v flutter)\")/..\" && pwd)\"\nfi\nSETTINGS=\"$FR/packages/flutter_tools/gradle/settings.gradle.kts\"\nif [ ! -f \"$SETTINGS\" ]; then\n  echo \"::warning title=补丁跳过::$SETTINGS 不存在（Flutter SDK 结构变了？）\"\n  exit 0\nfi\npython3 - \"$SETTINGS\" <<'PY'\nimport io\nimport sys\n\npath = sys.argv[1]\nsrc = io.open(path, encoding='utf-8').read()\nif 'pluginManagement' in src:\n    print('已有 pluginManagement，跳过')\n    raise SystemExit(0)\nhead = '''pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url = uri(\"https://maven.aliyun.com/repository/public\") }\n        maven { url = uri(\"https://maven.aliyun.com/repository/google\") }\n        maven { url = uri(\"https://maven.aliyun.com/repository/gradle-plugin\") }\n        gradlePluginPortal()\n    }\n}\n\n'''\nio.open(path, 'w', encoding='utf-8').write(head + src)\nPY\necho \"=== 打补丁后的 included build settings（前 14 行）===\"\nhead -14 \"$SETTINGS\"\n"
    - name: 给 Gradle buildscript 补多仓库兜底（init script）
      run: "mkdir -p \"$HOME/.gradle/init.d\"\ncat > \"$HOME/.gradle/init.d/00-mirrors.gradle\" <<'GRADLE'\ndef mirrors = [\n    'https://maven.aliyun.com/repository/public',\n    'https://maven.aliyun.com/repository/google',\n    'https://maven.aliyun.com/repository/gradle-plugin',\n]\n\nallprojects { p ->\n    p.buildscript.repositories {\n        google()\n        mavenCentral()\n        mirrors.each { u -> maven { url = u } }\n        gradlePluginPortal()\n    }\n}\nGRADLE\necho \"已写入 $HOME/.gradle/init.d/00-mirrors.gradle\"\ncat \"$HOME/.gradle/init.d/00-mirrors.gradle\"\n"
    - name: 构建 release APK
      run: "set -o pipefail\nfor attempt in 1 2 3; do\n  echo \"===== 第 $attempt 次 flutter build apk =====\"\n  if flutter build apk --release 2>&1 | tee \"$RUNNER_TEMP/android-build.log\"; then\n    exit 0\n  fi\n  if [ \"$attempt\" = \"3\" ]; then break; fi\n  echo \"第 $attempt 次失败，清掉 Kotlin 依赖缓存后重试（10s）\"\n  rm -rf \"$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin\" \\\n         \"$HOME/.gradle/caches/modules-2/files-2.1/org.gradle.kotlin\" \\\n         \"$HOME/.gradle/caches/modules-2/metadata-2.\"* 2>/dev/null || true\n  sleep 10\ndone\necho '::error title=APK 构建失败::三次都失败，看上面日志里第一个 \"What went wrong\" 段'\nexit 1\n"
    - name: 固定密钥重签名
      run: "set -o pipefail\nSDK_ROOT=\"${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}\"\nAPKSIGNER=\"$(ls -t \"$SDK_ROOT\"/build-tools/*/apksigner 2>/dev/null | head -1)\"\nif [ -z \"$APKSIGNER\" ]; then\n  echo '::error::找不到 apksigner（build-tools 未安装？）'\n  exit 1\nfi\nAPK=\"build/app/outputs/flutter-apk/app-release.apk\"\nZIPALIGN=\"$(dirname \"$APKSIGNER\")/zipalign\"\n\"$ZIPALIGN\" -f 4 \"$APK\" \"$APK.aligned\"\n# 别名只在 Secrets 路径必填（用户的 keystore 可能多条目）；仓库/兜底\n# keystore 都只有一条目，留空让 apksigner 自己选，避开 PFX 别名是\n# \"1\" 还是 friendlyname 的平台差异。\n# keystore 类型按文件魔数定（JKS 头是 FEEDFEED，其余按 PKCS12 读），\n# 不赌 apksigner 的默认类型探测 —— 仓库这份是 Windows 导出的 PFX（PKCS12）。\nMAGIC=\"$(head -c 4 \"$RUNNER_TEMP/ks/release.jks\" | od -An -tx1 | tr -d ' \\n')\"\nKSTYPE=PKCS12\nif [ \"$MAGIC\" = \"feedfeed\" ]; then KSTYPE=JKS; fi\necho \"keystore 类型：$KSTYPE\"\nSIGN_ARGS=(sign\n  --ks \"$RUNNER_TEMP/ks/release.jks\"\n  --ks-type \"$KSTYPE\"\n  --ks-pass \"file:$RUNNER_TEMP/ks/store-pass.txt\"\n  --key-pass \"file:$RUNNER_TEMP/ks/key-pass.txt\"\n  --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true)\nALIAS=\"$(cat \"$RUNNER_TEMP/ks/alias.txt\")\"\nif [ -n \"$ALIAS\" ]; then\n  SIGN_ARGS+=(--ks-key-alias \"$ALIAS\")\nfi\n\"$APKSIGNER\" \"${SIGN_ARGS[@]}\" \"$APK.aligned\"\nmv -f \"$APK.aligned\" \"$APK\"\n\"$APKSIGNER\" verify --print-certs \"$APK\" | head -5\n"
    - name: 重命名产物
      run: "mkdir -p \"$RUNNER_TEMP/out\"\ncp build/app/outputs/flutter-apk/app-release.apk \\\n   \"$RUNNER_TEMP/out/webshell-${APP_ID_EFFECTIVE}-${{ github.run_number }}.apk\"\n"
    - uses: actions/upload-artifact@v4
      with:
        name: webshell-android-apk
        path: ${{ runner.temp }}/out/*.apk
        if-no-files-found: error
        retention-days: 30
    - name: 失败原因（免登录可读）
      if: failure()
      shell: bash
      run: "shopt -s nullglob\nfiles=( \"$RUNNER_TEMP\"/*.log \"$(dirname \"$RUNNER_TEMP\")\"/_diag/Worker_*.log )\nif [ ${#files[@]} -eq 0 ]; then\n  printf '::error title=%s::%s\\n' 'Android 构建失败' '没找到日志文件，请登录 GitHub 查看'\n  exit 0\nfi\n# 只看 tail 是坑：Gradle 失败时尾部全是线程堆栈和\"--stacktrace\"提示，\n# 真正的错因在更上面的 \"* What went wrong\" 段，纯 tail 正好把它截掉。\n# 所以先按\"错误特征行\"捞一遍错因，再补一段较短的 tail 当上下文。\nfor f in $(ls -t \"${files[@]}\" | head -3); do\n  why=$(awk '/\\* What went wrong:/{f=1} f{print; if(++n>28) exit}' \"$f\")\n  errs=$(grep -aE '(^e: |error:|^FAILURE: Build|Could not resolve|Could not find|Unsupported class file)' \"$f\" | head -14)\n  diag=$(printf '%s\\n%s\\n' \"$why\" \"$errs\" | sed '/^$/d')\n  if [ -n \"$diag\" ]; then\n    printf '::error title=%s::%s\\n' \\\n      \"$(basename \"$f\") 错因\" \\\n      \"$(printf '%s' \"$diag\" | head -c 2600 | tr '\\r\\n' '~~')\"\n  fi\n  printf '::error title=%s::%s\\n' \"$(basename \"$f\") 尾部\" \"$(tail -c 1200 \"$f\" | tr '\\r\\n' '~~')\"\ndone\n"
