name: Build Shell App

on:
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - '.github/workflows/build-shell.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 平台目录不在仓库里（开发机没有 Flutter SDK，生成不了），
      # CI 现场补：flutter create 只补缺失的 android/，已有的 lib/pubspec 不动。
      - name: Generate android platform folder
        run: flutter create --platforms=android --org com.webshell --project-name webshell .

      # WebView 应用必须能上网；项目场景明确含内网 http 站点（http://192.168.x.x），
      # 所以 cleartext 也要放行（Android 9+ 默认禁明文流量）。
      - name: Patch AndroidManifest (INTERNET + cleartext)
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

      - name: Pub get + analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shell-android-apk
          path: shell/app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate windows platform folder
        run: flutter create --platforms=windows --project-name webshell .

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # Release 目录 = exe + 一堆 dll，整个目录一起打包
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: shell-windows-x64
          path: shell/app/build/windows/x64/runner/Release/
          if-no-files-found: error
