name: probe-a
'on':
  push:
    paths:
    - .github/workflows/probe-a.yml
jobs:
  test-core:
    name: core 单测（dart test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/core
    steps:
    - uses: actions/checkout@v4
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    - name: 版本自检
      run: dart --version
    - run: dart pub get
    - name: 静态分析（只把 error 当失败）
      run: dart analyze --no-fatal-warnings
    - name: 单元测试
      run: dart test -r expanded
