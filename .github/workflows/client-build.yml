name: client-build

# 只在客户端相关文件变化时跑：改 worker.js / README 不该触发 5 分钟的手机+桌面构建。
on:
  push:
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-build.yml'
  workflow_dispatch:

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # 换包名只改这一处（会写进 Android applicationId 与 Windows 的可执行文件名）
  ORG: dev.cfwtxt
  APP: cfwtxt

jobs:
  # ---------------------------------------------------------------- 纯 Dart 单测
  # 先跑这个：几秒钟就能把 URL 解析 / 认证 / API 封装 / 同步引擎的逻辑错误挡住，
  # 而 Flutter 编译（尤其 Windows）要几分钟，别浪费那个时间。
  test-core:
    name: core 单测（dart test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 版本自检
        run: dart --version

      - run: dart pub get

      # 注意：**不要**加 --no-fatal-infos —— Dart 3.13 起这个选项已被移除（传了会以
      # "Cannot negate option" 直接退出 64，看着像代码错，其实是用法错）。
      # 现在 info 本来就不致命，只保留 --no-fatal-warnings 就等价于"只有 error 才失败"。
      - name: 静态分析（只把 error 当失败）
        run: dart analyze --no-fatal-warnings

      - name: 单元测试
        run: dart test -r expanded

  # ---------------------------------------------------------------- Android
  android:
    name: Android APK
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # 仓库里**故意不存** android/ 这一堆生成文件（Gradle 版本、AGP、模板会随 Flutter
      # 升级而变化，存进来迟早和 SDK 打架）。这里现生成再拷回来，只保留 lib/ 作为真相源。
      - name: 生成 Android 平台脚手架
        working-directory: client/app
        run: |
          flutter create \
            --platforms=android \
            --org "$ORG" \
            --project-name "$APP" \
            "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android

      - name: 补 INTERNET 权限 / 应用名（Flutter 模板只在 debug 里给联网权限）
        working-directory: client/app
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')

          # release 包默认**没有** INTERNET 权限（模板只把它放进 debug/profile），
          # 漏了这一步的典型症状是：debug 装上去能用，release 装上去全部请求失败。
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', 
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n\n'
                  '    <application', 1)

          # 允许 http://（本机 / 内网反代真的会用）。https 的安全性完全不受影响。
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application',
                  '<application\n        android:usesCleartextTraffic="true"', 1)

          s = re.sub(r'android:label="[^"]*"', 'android:label="CF-Workers-TXT"', s, count=1)
          p.write_text(s, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PY

      # Flutter 自带的 included build（packages/flutter_tools/gradle）里写死了
      #   repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
      #   repositories { google(); mavenCentral() }
      # —— 只有这两个仓库。runner 上 Maven Central 一旦限流/超时，:gradle 的
      # compileClasspath 就是整片 "Could not find kotlin-stdlib / javawriter / asm"，
      # 看着像版本不存在，实际是下载不到（本地 curl 那几个 POM 全是 200）。
      # 因为 FAIL_ON_PROJECT_REPOS，init script 给 p.repositories 补仓库会被判违规，
      # 只能在源头上把镜像塞进去。
      - name: 给 Flutter 自带的 Gradle 构建补镜像仓库
        run: |
          set -o pipefail
          FR="${FLUTTER_ROOT:-}"
          if [ -z "$FR" ]; then
            FR="$(cd "$(dirname "$(command -v flutter)")/.." && pwd)"
          fi
          SETTINGS="$FR/packages/flutter_tools/gradle/settings.gradle.kts"
          if [ ! -f "$SETTINGS" ]; then
            echo "::warning title=补丁跳过::$SETTINGS 不存在（Flutter SDK 结构变了？）"
            exit 0
          fi
          python3 - "$SETTINGS" <<'PY'
          import io
          import sys

          path = sys.argv[1]
          src = io.open(path, encoding='utf-8').read()

          MIRRORS = ''.join(
              '        maven { url = uri("%s") }\n' % u for u in (
                  'https://maven.aliyun.com/repository/public',
                  'https://maven.aliyun.com/repository/google',
                  'https://maven.aliyun.com/repository/gradle-plugin',
              )
          )

          changed = []

          if 'maven.aliyun.com' not in src:
              marker = '        mavenCentral()\n'
              if marker in src:
                  src = src.replace(marker, marker + MIRRORS, 1)
                  changed.append('依赖仓库镜像')
              else:
                  print('::warning title=镜像没加上::没找到 mavenCentral() 行，Flutter SDK 结构变了？')
          else:
              print('已有阿里云镜像，跳过')

          if 'pluginManagement' not in src:
              head = 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n' \
                     + MIRRORS + '        gradlePluginPortal()\n    }\n}\n\n'
              src = head + src
              changed.append('pluginManagement')
          else:
              print('已有 pluginManagement，跳过')

          io.open(path, 'w', encoding='utf-8').write(src)
          print('已改：', '、'.join(changed) if changed else '无')
          PY
          head -20 "$SETTINGS"

      # 第二道兜底：buildscript 仓库不受 repositoriesMode 管控，给所有 project
      # 的 buildscript 补 Maven Central / Google / 阿里云镜像。只碰 buildscript，
      # 绝不碰 p.repositories（Flutter 的 included build 是 FAIL_ON_PROJECT_REPOS）。
      - name: 给 Gradle buildscript 补多仓库兜底（init script）
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/00-mirrors.gradle" <<'GRADLE'
          def mirrors = [
              'https://maven.aliyun.com/repository/public',
              'https://maven.aliyun.com/repository/google',
              'https://maven.aliyun.com/repository/gradle-plugin',
          ]

          allprojects { p ->
              p.buildscript.repositories {
                  google()
                  mavenCentral()
                  mirrors.each { u -> maven { url = u } }
                  gradlePluginPortal()
              }
          }
          GRADLE
          echo "已写入 $HOME/.gradle/init.d/00-mirrors.gradle"

      - name: pub get
        working-directory: client/app
        run: flutter pub get

      - name: 静态分析（只把 error 当失败）
        working-directory: client/app
        # 与 core 的 `dart analyze` 相反：flutter analyze 默认把 **info 也算致命**
        # （本地 3.47.7 实测：只报 7 条 info 也会退 1），所以这里必须显式带 --no-fatal-infos。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 说明：Flutter 模板的 release 默认用 **debug keystore** 签名，所以不配 Secrets
      # 也能产出一个可侧载安装的 APK。想换成正式签名，就在仓库 Secrets 里放
      # KEYSTORE_BASE64 / KEY_ALIAS / KEY_PASSWORD / STORE_PASSWORD，再在此处解码并在
      # android/app/build.gradle(.kts) 里接上 signingConfig —— 但那属于"分发"环节，
      # 不该成为"能不能编译通过"的前提。
      # 网络抖动（镜像 429/502 返回 HTML 而不给 POM、portal 偶发不可达）是这类失败
      # 最常见的推手。报错可能是 "Gradle threw an error while downloading artifacts"，
      # 也可能是 "Plugin [id: 'org.gradle.kotlin.kotlin-dsl', version: '6.5.7'] was not
      # found" —— 看着像版本不存在，其实那些 POM 本地 curl 全是 200，纯粹下载不到。
      # 给它 3 次机会，每次先清掉可能被写坏的 kotlin 依赖缓存块（半截 .pom 会一直
      # "存在但坏"）。
      - name: 构建 release APK
        working-directory: client/app
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "===== 第 $attempt 次 flutter build apk ====="
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then break; fi
            echo "第 $attempt 次失败，清 Kotlin 依赖缓存后重试（10s）"
            rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin" \
                   "$HOME/.gradle/caches/modules-2/files-2.1/org.gradle.kotlin" \
                   "$HOME/.gradle/caches/modules-2/metadata-2."* 2>/dev/null || true
            sleep 10
          done
          echo '::error title=APK 构建失败::三次都失败，看上面日志里第一个 "What went wrong" 段'
          exit 1

      - name: 重命名产物
        working-directory: client/app
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$RUNNER_TEMP/out/cfwtxt-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cfwtxt-android-apk
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows 便携版
    needs: test-core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: 打开桌面支持
        run: flutter config --enable-windows-desktop

      - name: 生成 Windows 平台脚手架
        shell: pwsh
        run: |
          flutter create --platforms=windows --org "$env:ORG" --project-name "$env:APP" "$env:RUNNER_TEMP\scaffold"
          Copy-Item -Recurse "$env:RUNNER_TEMP\scaffold\windows" ".\windows"

      - name: pub get
        run: flutter pub get

      - name: 静态分析（只把 error 当失败）
        # 与 core 的 `dart analyze` 相反：flutter analyze 默认把 **info 也算致命**
        # （本地 3.47.7 实测：只报 7 条 info 也会退 1），所以这里必须显式带 --no-fatal-infos。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 release
        run: flutter build windows --release

      # 只拷 exe 是不够的：同一目录下的 flutter_windows.dll 与 data/ 缺一不可。
      # 所以这里压的是**整个 Release 目录**，解压即用。
      - name: 打包便携版
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "没找到产物目录：$src" }
          $out = "$env:RUNNER_TEMP\cfwtxt-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal
          Write-Host "产物：" (Get-Item $out).Length "bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: cfwtxt-windows-x64
          path: ${{ runner.temp }}/cfwtxt-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
