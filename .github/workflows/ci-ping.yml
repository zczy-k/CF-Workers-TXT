name: ci-ping

# 临时诊断：确认 Actions 能不能给这个仓库起 job。
# 如果这个文件也是 startup_failure，那问题在仓库/平台侧，不在 shell-build.yml。
# 诊断完就删。
on:
  push:
    paths:
      - '.github/workflows/ci-ping.yml'
  workflow_dispatch:

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    steps:
      - name: 打个招呼
        run: |
          echo "ping ok"
          echo "${{ github.sha }}"
