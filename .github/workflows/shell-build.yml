name: shell-build

# 万能壳的构建。两种产物都从这里出：
#   * 直接 push：打"通用壳"（没有预置站点，用户自己加）—— 用来验证代码能编译、能跑；
#   * 手动 Run workflow 填参数：打"白标版"（预置站点 + 自己的名字/包名/图标/主题色）。
# 白标不是另一份代码：只是构建期覆盖 assets/preset.json 与平台图标。
on:
  push:
    paths:
      - 'shell/**'
      - '.github/workflows/shell-build.yml'
  pull_request:
    paths:
      - 'shell/**'
      - '.github/workflows/shell-build.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App 名字（安卓桌面图标名 / Windows 窗口标题）。留空 = WebShell'
        required: false
        default: ''
      app_id:
        description: '包名/组织名，例如 com.corp.oa。留空 = dev.webshell.webshell（最后一段决定 Windows 的 exe 名）'
        required: false
        default: ''
      preset_url:
        description: '预置站点地址（白标版入口，例如 oa.corp.com）。留空 = 通用壳'
        required: false
        default: ''
      preset_name:
        description: '预置站点在列表里显示的名字。留空 = 用域名'
        required: false
        default: ''
      theme_color:
        description: '主题色 #RRGGBB。留空 = #2962FF'
        required: false
        default: ''
      logo_url:
        description: '图标图片地址（PNG/JPG/ICO）。留空则看下面两项'
        required: false
        default: ''
      logo_path:
        description: '仓库里的图标文件路径，例如 shell/branding/logo.png'
        required: false
        default: ''
      auto_icon:
        description: '没给图标时，自动抓预置站点的 favicon 生成各个尺寸'
        required: false
        type: boolean
        default: true
      allow_add_site:
        description: '白标版是否仍允许用户自己再加站点'
        required: false
        type: boolean
        default: true

concurrency:
  group: shell-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # ---------------------------------------------------------------- 纯 Dart 单测
  # 先跑这个：URL 规则、配置容错、下载队列（续传/重试/并发/取消）几秒钟就能验证完，
  # 而 Flutter 编译（尤其 Windows）要几分钟，没必要让它先跑。
  test-core:
    name: core 单测（dart test）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 版本自检
        run: dart --version

      - run: dart pub get

      # 注意：**不要**加 --no-fatal-infos —— Dart 3.13 起这个选项已被移除（传了会以
      # "Cannot negate option" 直接退出 64，看着像代码错，其实是用法错）。
      - name: 静态分析（只把 error 当失败）
        run: dart analyze --no-fatal-warnings

      - name: 单元测试
        run: dart test -r expanded

  # ---------------------------------------------------------------- 白标产物
  # 图标要按密度切、还要转 .ico，放在 ubuntu 上做（自带 ImageMagick），
  # 两个平台 job 再从产物里取，保证两端口径一致。
  branding:
    name: 白标产物（图标 + preset.json）
    needs: test-core
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      APP_ID: ${{ github.event.inputs.app_id }}
      PRESET_URL: ${{ github.event.inputs.preset_url }}
      PRESET_NAME: ${{ github.event.inputs.preset_name }}
      THEME_COLOR: ${{ github.event.inputs.theme_color }}
      LOGO_URL: ${{ github.event.inputs.logo_url }}
      LOGO_PATH: ${{ github.event.inputs.logo_path }}
      AUTO_ICON: ${{ github.event.inputs.auto_icon || 'true' }}
      ALLOW_ADD_SITE: ${{ github.event.inputs.allow_add_site || 'true' }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-22.04 的镜像自带 ImageMagick，**ubuntu-24.04 起就没有了**（2026-10 查
      # actions/runner-images 的软件清单：24.04 与 26.04 里都搜不到 imagemagick，
      # 而 ubuntu-latest 已经指向 24.04+），所以这里显式装一次。
      # 顺带装 DejaVu 字体：首字母图标要用字体，否则只能退化成几何图形。
      - name: 装 ImageMagick 与字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core
          (magick -version 2>/dev/null || convert -version) | head -2

      - name: 生成图标与白标配置
        run: |
          # 用 pipefail 才能让 tee 之后仍然按脚本的退出码判定成败
          set -o pipefail
          bash shell/tools/branding.sh "$RUNNER_TEMP/branding" 2>&1 | tee "$RUNNER_TEMP/branding.log"

      - uses: actions/upload-artifact@v4
        with:
          name: shell-branding
          path: ${{ runner.temp }}/branding
          if-no-files-found: error
          retention-days: 7

      - name: 失败原因（免登录可读）
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=( "$RUNNER_TEMP"/*.log "$(dirname "$RUNNER_TEMP")"/_diag/Worker_*.log )
          if [ ${#files[@]} -eq 0 ]; then
            printf '::error title=%s::%s\n' 'branding 失败' '没找到日志文件，请登录 GitHub 查看'
            exit 0
          fi
          for f in $(ls -t "${files[@]}" | head -3); do
            printf '::error title=%s::%s\n' "$(basename "$f") 尾部" "$(tail -c 2500 "$f" | tr '\r\n' '~~')"
          done

  # ---------------------------------------------------------------- Android
  android:
    name: Android APK
    needs: [test-core, branding]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: shell-branding
          path: ${{ runner.temp }}/branding

      - name: 读取本次白标参数
        run: |
          cat "$RUNNER_TEMP/branding/app-id.env" >> "$GITHUB_ENV"
          echo "本次构建：$APP_ID_EFFECTIVE（$APP_NAME_EFFECTIVE）"

      # 仓库里**故意不存** android/ 这一堆生成文件：Gradle 版本、AGP、模板都会随
      # Flutter 升级变化，存进来迟早和 SDK 打架。现生成再拷回来，只留 lib/ 作真相源。
      - name: 生成 Android 平台脚手架
        run: |
          flutter create \
            --platforms=android \
            --org "$ORG" \
            --project-name "$NAME" \
            "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android

      - name: 放入白标图标与预置配置
        run: |
          set -o pipefail
          {
            cp -r "$RUNNER_TEMP/branding/android-res/." android/app/src/main/res/
            cp "$RUNNER_TEMP/branding/preset.json" assets/preset.json
            python3 "$GITHUB_WORKSPACE/shell/tools/patch_platform.py" \
              manifest android/app/src/main/AndroidManifest.xml "$APP_NAME_EFFECTIVE"
          } 2>&1 | tee "$RUNNER_TEMP/patch-android.log"

      - name: pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/android-pub.log"

      # 上游坑：flutter_inappwebview_android 1.1.3 的 android/build.gradle 给
      # release buildType 用了 getDefaultProguardFile('proguard-android.txt')，
      # 而 Flutter 3.47 模板自带的 AGP 已把这个写法当成硬错误（构建直接失败）。
      # 目前 1.1.3 是最新 stable（1.2.0 只有 beta），所以只针对这一个文件把文件名
      # 换成 AGP 要求的 proguard-android-optimize.txt：语义上只是让 R8 能优化，
      # 对没开 minify 的构建没有任何实际影响。
      # 上游修好后下面的 grep 匹配不到，这一步会自动跳过（不会因此失败）。
      - name: 补丁：上游插件的 proguard 文件名
        run: |
          set -o pipefail
          {
            PUB="${PUB_CACHE:-$HOME/.pub-cache}"
            found=0
            for f in "$PUB"/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
              [ -f "$f" ] || continue
              if grep -q 'proguard-android\.txt' "$f"; then
                sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
                echo "已补丁：$f"
                found=1
              fi
            done
            if [ "$found" = 0 ]; then
              echo "提示：没有需要补丁的 flutter_inappwebview_android（上游可能已修）"
            fi
          } 2>&1 | tee "$RUNNER_TEMP/patch-proguard.log"

      - name: 静态分析（只把 error 当失败）
        # 与 core 的 `dart analyze` 相反：flutter analyze 默认把 info 也算致命
        # （本地 3.47.7 实测：只报 info 也会退 1），所以这里必须显式带 --no-fatal-infos。
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/android-analyze.log"

      # Flutter 模板的 release 默认用 debug keystore 签名，所以不配 Secrets 也能出
      # 一个可侧载安装的 APK。要正式签名请在 Secrets 里放 keystore 再改 build.gradle。
      - name: 构建 release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: 重命名产物
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "$RUNNER_TEMP/out/webshell-${APP_ID_EFFECTIVE}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: webshell-android-apk
          path: ${{ runner.temp }}/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # Actions 的原始日志必须登录才能看；注解（annotation）挂在 check run 上，
      # 公开仓库能免登录读到：
      #   GET /repos/<owner>/<repo>/commits/<sha>/check-runs
      #   GET /repos/<owner>/<repo>/check-runs/<id>/annotations
      # 所以失败时把各步骤日志的尾部转成注解，仓库外的人（和协助排错的 agent）也能诊断。
      - name: 失败原因（免登录可读）
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          files=( "$RUNNER_TEMP"/*.log "$(dirname "$RUNNER_TEMP")"/_diag/Worker_*.log )
          if [ ${#files[@]} -eq 0 ]; then
            printf '::error title=%s::%s\n' 'Android 构建失败' '没找到日志文件，请登录 GitHub 查看'
            exit 0
          fi
          for f in $(ls -t "${files[@]}" | head -3); do
            printf '::error title=%s::%s\n' "$(basename "$f") 尾部" "$(tail -c 2500 "$f" | tr '\r\n' '~~')"
          done

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows 便携版
    needs: [test-core, branding]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shell/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: shell-branding
          path: ${{ runner.temp }}/branding

      - name: 读取本次白标参数
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\branding\app-id.env" | ForEach-Object {
            if ($_ -match '^([A-Z_]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])" -Encoding utf8
            }
          }

      - name: 打开桌面支持
        run: flutter config --enable-windows-desktop

      # flutter_inappwebview 的 Windows 端在 CMake 配置阶段要调用 nuget 拉
      # WebView2 / WIL / nlohmann.json。runner 上通常自带，兜底装一次，别让它半夜炸。
      - name: 确保 nuget 可用
        shell: pwsh
        run: |
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
            Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          }
          (Get-Command nuget).Source

      - name: 生成 Windows 平台脚手架
        shell: pwsh
        run: |
          flutter create --platforms=windows --org "$env:ORG" --project-name "$env:NAME" "$env:RUNNER_TEMP\scaffold"
          Copy-Item -Recurse "$env:RUNNER_TEMP\scaffold\windows" ".\windows"

      - name: 换成白标图标、窗口标题与预置配置
        shell: pwsh
        run: |
          # Continue + 显式 -ErrorAction Stop：既不让原生命令的 stderr 变成终止错误
          # （pwsh 7.4+ 的坑），又让 Copy-Item 真失败时确实失败。
          # 整段包在 try/finally 里：无论成功失败，日志都会落到文件，失败注解才拿得到文本。
          $ErrorActionPreference = 'Continue'
          $log = "$env:RUNNER_TEMP\patch-windows.log"
          $lines = New-Object System.Collections.Generic.List[string]
          $fail = 0
          try {
            $script = "$env:GITHUB_WORKSPACE\shell\tools\patch_platform.py"
            $lines.Add("APP_NAME_EFFECTIVE=$env:APP_NAME_EFFECTIVE  APP_ID_EFFECTIVE=$env:APP_ID_EFFECTIVE")

            Copy-Item "$env:RUNNER_TEMP\branding\app_icon.ico" "windows\runner\resources\app_icon.ico" -Force -ErrorAction Stop
            Copy-Item "$env:RUNNER_TEMP\branding\preset.json" "assets\preset.json" -Force -ErrorAction Stop

            # runner 上 python / py / python3 到底哪个能用不一定，而且必须**真跑一次**才算数：
            # Windows 上 python.exe 可能只是商店"应用执行别名"占位符，存在但一跑就报
            # "Python was not found" 然后退出 1（本机就是这样，CI 上也可能）。
            $cands = @(
              @{ exe = 'python';  pre = @() },
              @{ exe = 'py';      pre = @('-3') },
              @{ exe = 'python3'; pre = @() }
            )
            $chosen = $null
            foreach ($c in $cands) {
              if (-not (Get-Command $c.exe -ErrorAction SilentlyContinue)) { continue }
              $pre = $c.pre
              $probe = @($pre) + @('-c', 'import sys;print(sys.version)')
              & $c.exe @probe *> $null
              if ($LASTEXITCODE -eq 0) { $chosen = $c; break }
              $lines.Add("$($c.exe) 不可用（退出码 $LASTEXITCODE），换下一个")
            }
            if ($null -eq $chosen) {
              $lines.Add("错误：runner 上找不到可用的 python（试过 python / py -3 / python3）")
              $fail = 1
            } else {
              $pre = $chosen.pre
              $lines.Add("用的 python：$($chosen.exe) $($pre -join ' ')")
              $argv = @($pre) + @($script, 'windows', 'windows', "$env:APP_NAME_EFFECTIVE")
              $lines.Add((& $chosen.exe @argv 2>&1 | Out-String))
              $code = $LASTEXITCODE
              if ($null -eq $code) { $code = 0 }
              $lines.Add("patch_platform.py 退出码：$code")
              if ($code -ne 0) { $fail = $code }
            }
          } catch {
            $fail = 1
            $lines.Add("异常：" + $_.Exception.Message)
          } finally {
            $lines | Tee-Object -FilePath $log
          }
          if ($fail -ne 0) { exit $fail }

      - name: pub get
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter pub get 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-pub.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 静态分析（只把 error 当失败）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-analyze.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 构建 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\windows-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 只拷 exe 是不够的：同目录的 flutter_windows.dll 与 data/ 缺一不可，
      # 所以压的是整个 Release 目录，解压即用。
      - name: 打包便携版
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (-not (Test-Path $src)) { throw "没找到产物目录：$src" }
          $out = "$env:RUNNER_TEMP\webshell-windows-$env:APP_ID_EFFECTIVE.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -CompressionLevel Optimal
          Write-Host "产物：" (Get-Item $out).Length "bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: webshell-windows-x64
          path: ${{ runner.temp }}/webshell-windows-*.zip
          if-no-files-found: error
          retention-days: 30

      # 同 Android job 里的说明：原始日志要登录才能看，注解免登录可读，
      # 所以失败时把诊断日志尾部打成注解。
      # 上面几个步骤都做了 tee（先 $ErrorActionPreference='Continue' 再用
      # 2>&1 | Tee-Object，最后显式 exit $LASTEXITCODE）：这样既不会因为 pwsh 7.4+
      # 把原生命令 stderr 当错误而假失败，又能让真失败带上完整报错文本。
      - name: 失败原因（免登录可读）
        if: failure()
        shell: pwsh
        run: |
          $cands = @()
          $cands += Get-ChildItem "$env:RUNNER_TEMP\*.log" -ErrorAction SilentlyContinue
          $cands += Get-ChildItem "$(Split-Path $env:RUNNER_TEMP -Parent)\_diag\*.log" -ErrorAction SilentlyContinue
          $files = $cands | Sort-Object LastWriteTime -Descending | Select-Object -First 3
          if (-not $files) {
            # 连日志都没找到时，把诊断目录里到底有什么打出来，别只说"请登录查看"
            $where = "$(Split-Path $env:RUNNER_TEMP -Parent)\_diag"
            $hint = (Get-ChildItem $where -ErrorAction SilentlyContinue | Select-Object -First 12 -ExpandProperty Name) -join ", "
            Write-Host "::error title=Windows 构建失败::没找到日志文件（$where 下有：$hint）"
            return
          }
          foreach ($f in $files) {
            $text = (Get-Content -LiteralPath $f.FullName -Tail 30 -ErrorAction SilentlyContinue) -join " ~ "
            if ($text.Length -gt 2500) { $text = $text.Substring($text.Length - 2500) }
            Write-Host "::error title=$($f.Name) 尾部::$text"
          }
